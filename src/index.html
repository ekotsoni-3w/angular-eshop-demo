<!doctype html>
<html lang="en">
  <head>
    <!-- Δηλώνει το σύνολο χαρακτήρων της σελίδας ώστε να εμφανίζονται σωστά τα γράμματα. -->
    <meta charset="utf-8" />
    <!-- Ο τίτλος που φαίνεται στο tab του browser. -->
    <title>Angular eShop Demo</title>
    <meta
      name="description"
      content="A responsive Angular e-shop demo with product browsing, details and cart management."
    />
    <!-- Η βάση όλων των routes της εφαρμογής. Συνήθως μένει "/" σε απλές Angular εφαρμογές. -->
    <base href="/" />
    <!-- Κάνει τη σελίδα responsive σε κινητά και tablets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Το μικρό εικονίδιο που φαίνεται στο tab του browser. -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <!-- Εδώ "κουμπώνει" το root Angular component και από εκεί ξεκινά όλο το app. -->
    <app-root></app-root>
  </body>
</html>
